<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Øveark-generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="controls no-print">

    <div class="lang-row">
      <select id="lang">
        <option value="no">Norsk</option>
        <option value="en">English</option>
      </select>
    </div>

    <h2 data-i18n="panelTitle">Øveark-generator</h2>

    <div class="form-grid">
      <label>
        <span data-i18n="labelTitle">Tittel</span>
        <input type="text" id="title" value="Øveark: Rettskriving">
      </label>
      <label>
        <span data-i18n="labelInstruction">Instruksjon</span>
        <input type="text" id="instruction" value="Skriv én bokstav i hver rute.">
      </label>
      <label>
        <span data-i18n="labelColumns">Øvingskolonner</span>
        <input type="number" id="columns" value="3" min="1" max="6">
      </label>
      <label>
        <span data-i18n="labelBoxSize">Boksstørrelse (cm)</span>
        <input type="number" id="boxSize" value="1.3" min="0.8" max="2.0" step="0.1">
      </label>
      <label>
        <span data-i18n="labelStyle">Stil</span>
        <select id="style">
          <option value="boxes" data-i18n="styleBoxes">Bokser</option>
          <option value="lines" data-i18n="styleLines">Understrek</option>
          <option value="bare"  data-i18n="styleBare">Bare bokstaver</option>
        </select>
      </label>
      <label>
        <span data-i18n="labelCase">Bokstavform</span>
        <select id="caseMode">
          <option value="lower" data-i18n="caseLower">små bokstaver</option>
          <option value="upper" data-i18n="caseUpper">STORE BOKSTAVER</option>
          <option value="title" data-i18n="caseTitle">Forbokstav stor</option>
        </select>
      </label>
      <label>
        <span data-i18n="labelWordCol">Ord-kolonne</span>
        <select id="wordCol">
          <option value="full"   data-i18n="wordColFull">Vis fullt ord</option>
          <option value="hint"   data-i18n="wordColHint">Første bokstav (B…)</option>
          <option value="hidden" data-i18n="wordColHidden">Skjul</option>
        </select>
      </label>
    </div>

    <label class="trace-row full-width">
      <input type="checkbox" id="trace">
      <span data-i18n="traceLabel">Vis lysegrå bokstaver til å spore over</span>
    </label>
    <label class="trace-row full-width">
      <input type="checkbox" id="coverPage">
      <span data-i18n="coverLabel">Legg til forside med øveordene</span>
    </label>

    <label class="full-width">
      <div class="words-header">
        <span><span data-i18n="wordsLabel">Ordliste</span>&nbsp;<span class="hint" data-i18n="wordsHint">(ett ord per linje)</span></span>
        <div class="words-actions">
          <button type="button" id="randomBtn" data-i18n="btnRandom">Tilfeldig</button>
          <button type="button" id="pasteBtn" data-i18n="btnPaste">Lim inn</button>
          <button type="button" id="clearBtn" data-i18n="btnClear">Tøm</button>
        </div>
      </div>
      <textarea id="words" rows="12" placeholder="bord&#10;jord&#10;fjord&#10;ord&#10;hard"></textarea>
    </label>

    <div class="buttons">
      <button id="generateBtn" data-i18n="btnGenerate">Generer ark</button>
      <button id="pdfBtn" class="secondary" data-i18n="btnPDF">Lagre som PDF</button>
      <button id="printBtn" class="secondary" data-i18n="btnPrint">Skriv ut</button>
    </div>

  </aside>

  <main id="sheet"></main>

  <script src="script.js"></script>
  <script data-goatcounter="https://tomray74.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
