<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Øveark-generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="controls no-print">
    <h2>Øveark-generator</h2>

    <div class="form-grid">
      <label>
        Tittel
        <input type="text" id="title" value="Øveark: Rettskriving">
      </label>
      <label>
        Instruksjon
        <input type="text" id="instruction" value="Skriv én bokstav i hver rute.">
      </label>
      <label>
        Øvingskolonner
        <input type="number" id="columns" value="3" min="1" max="6">
      </label>
      <label>
        Boksstørrelse (cm)
        <input type="number" id="boxSize" value="1.3" min="0.8" max="2.0" step="0.1">
      </label>
      <label>
        Stil
        <select id="style">
          <option value="boxes">Bokser</option>
          <option value="lines">Understrek</option>
          <option value="bare">Bare bokstaver</option>
        </select>
      </label>
      <label>
        Bokstavform
        <select id="caseMode">
          <option value="lower">små bokstaver</option>
          <option value="upper">STORE BOKSTAVER</option>
          <option value="title">Forbokstav stor</option>
        </select>
      </label>
      <label>
        Ord-kolonne
        <select id="wordCol">
          <option value="full">Vis fullt ord</option>
          <option value="hint">Første bokstav (B…)</option>
          <option value="hidden">Skjul</option>
        </select>
      </label>
    </div>

    <label class="trace-row full-width">
      <input type="checkbox" id="trace">
      Vis lysegrå bokstaver til å spore over
    </label>
    <label class="trace-row full-width">
      <input type="checkbox" id="coverPage">
      Legg til forside med øveordene
    </label>

    <label class="full-width">
      Ordliste <span class="hint">(ett ord per linje)</span>
      <textarea id="words" rows="12" placeholder="bord&#10;jord&#10;fjord&#10;ord&#10;hard"></textarea>
    </label>

    <div class="buttons">
      <button id="generateBtn">Generer ark</button>
      <button id="printBtn" class="secondary">Skriv ut</button>
    </div>
  </aside>

  <main id="sheet"></main>

  <script src="script.js"></script>
</body>
</html>
