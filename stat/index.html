<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Øveark – Besøksstatistikk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    header a {
      color: #555;
      text-decoration: none;
      font-size: .9rem;
    }
    header a:hover { color: #111; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header .external {
      margin-left: auto;
      font-size: .85rem;
    }
    main { flex: 1; padding: 1rem 1.5rem; }
    iframe {
      width: 100%;
      height: calc(100vh - 100px);
      border: none;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <a href="../">← Tilbake til appen</a>
    <h1>Besøksstatistikk</h1>
    <a class="external" href="https://tomray74.goatcounter.com/" target="_blank" rel="noopener">
      Åpne i nytt vindu ↗
    </a>
  </header>
  <main>
    <iframe
      src="https://tomray74.goatcounter.com/"
      title="Besøksstatistikk – GoatCounter">
    </iframe>
  </main>
</body>
</html>
